# This is the keepalived-gateway.sh system-wide configuration file.

# NOTE: If any parameter is not needed, you can leave it empty ("")
# or comment out the entire line with a '#' at the beginning.

# Global INTERFACE
# The default network interface used for gateways that don't have one
# explicitly defined.
INTERFACE=""

# Global METRIC
# Default route metric. (Example: 0, 100, 200).
# Defaults to "0"
METRIC=""

# List gateways separated by commas or spaces.
# Format: [INTERFACE=]IP[=METRIC]
#
# Both IPv4 (e.g., 192.168.1.1) and IPv6 (e.g., 2001:db8::1) are supported.
# The gateway's address family determines whether IPv4 or IPv6 will be used
# for PING_HOST and SPEEDTEST_HOST checks.
#
# Example: GATEWAYS="192.168.1.4 2001:db8:1::1 ens20=192.168.1.6=10 ens21=[2001:db8:2::1]=50"
# "192.168.1.4"              -> IPv4 gateway (uses global INTERFACE and METRIC)
# "2001:db8:1::1"            -> IPv6 gateway (triggers IPv6-based health checks)
# "ens20=192.168.1.6=10"     -> explicit interface and metric
# "ens21=[2001:db8:2::1]=50" -> IPv6 with explicit settings
GATEWAYS=""

# Remote host or gateway availability check interval.
# Supported units: s (seconds), m (minutes), h (hours), d (days), w (weeks), M (months), y (years).
# Examples: 30s, 10m, 1h, 1d, 1w, 1M, 1y.
# Defaults to "30"
CHECK_INTERVAL="30s"

# Host (IP/DNS) for availability monitoring through gateways
# Leave empty to disable internet connectivity checks.
# Examples:
#   PING_HOST="dns.google"
#   PING_HOST="8.8.8.8"
#   PING_HOST="2001:4860:4860::8844"
PING_HOST=""

# Check speed on gateways: yes/no
# Defaults to "no"
SPEEDTEST="no"

# Host (IP/DNS) for speedtest checks through gateways
# If no protocol (http:// or https://) is specified, http:// will be used by default.
# Example: SPEEDTEST_HOST="http://nbg1-speed.hetzner.com"
SPEEDTEST_HOST=""

# File size/path for speed testing.
# Example: SPEEDTEST_SCOPE="100MB.bin"
SPEEDTEST_SCOPE=""

# Operational Modes (ROLE):
# single:
#   Groups gateways by IP family (IPv4/6) and Metric. Selects the best gateway
#   per group based on PING_HOST or SPEEDTEST_HOST.
#
# master:
#   Operates identically to 'single', but if VIRTUAL_IPADDRESS is detected,
#   it starts a distribution service on VIRTUAL_PORT.
#
# master-advisor:
#   Operates as 'master' (checks and distribution) but does NOT apply
#   any routes to its own local routing table.
#
# slave:
#   Fetches the gateway list from the 'master' and applies it. No local checks
#   are performed unless the 'master' is unreachable or VIRTUAL_IPADDRESS
#   appears locally, in which case it switches to autonomous 'slave-single'
#   mode.
#
# slave-passive:
#   Operates as 'slave', but if the 'master' is unreachable, it remains
#   in standby mode without performing local health checks.
#
# cluster:
#   Dynamic High-Availability mode.
#   - Acts as 'master' (cluster-master) if VIRTUAL_IPADDRESS is found locally.
#   - Acts as 'slave' (cluster-slave) if VIRTUAL_IPADDRESS is missing.
#   - In 'slave' state, it uses 'survivor' logic (switches to cluster-autonomous
#     checks if the 'master' is unreachable).
#
# Defaults to "single"
ROLE="single"

# Virtual IP Address (CIDR format) managed by Keepalived.
# Required for 'master', 'master-advisor', 'slave', and 'cluster' roles.
# Examples:
#    VIRTUAL_IPADDRESS="192.168.1.1/24"
#    VIRTUAL_IPADDRESS="2001:db8:1:100::1/64"
VIRTUAL_IPADDRESS=""

# TCP port for gateway data distribution.
# Required for 'master', 'master-advisor', 'slave', and 'cluster' roles.
#
# master/master-advisor listens on this port via VIRTUAL_IPADDRESS.
# slave connects to the VIRTUAL_IPADDRESS on this port to fetch the gateways list.
# Example: VIRTUAL_PORT="8888"
VIRTUAL_PORT=""
