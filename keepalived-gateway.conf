# This is the keepalived-gateway.sh system-wide configuration file.

# NOTE: If any parameter is not needed, you can leave it empty ("")
# or comment out the entire line with a '#' at the beginning.
# Empty values for PING_HOST or SPEEDTEST_HOST will disable those checks.

# Global INTERFACE
# The default network interface used for gateways that don't have one explicitly defined.
INTERFACE="ens19"

# Global METRIC
# The default route metric for gateways that don't have one explicitly defined.
# Lower values represent higher priority.
# Default value is 0.
METRIC=0

# List gateways separated by commas or spaces.
# Format: [INTERFACE=]IP[=METRIC]
#
# Both IPv4 (e.g., 192.168.1.1) and IPv6 (e.g., 2001:db8::1) are supported.
# The gateway's address family determines whether IPv4 or IPv6 will be used
# for PING_HOST and SPEEDTEST_HOST checks.
#
# Examples:
# "192.168.1.4"              -> IPv4 gateway (uses global INTERFACE and METRIC)
# "2001:db8:1::1"            -> IPv6 gateway (triggers IPv6-based health checks)
# "ens20=192.168.1.6=10"     -> explicit interface and metric
# "ens21=[2001:db8:2::1]=50" -> IPv6 with explicit settings
GATEWAYS="192.168.1.4 2001:db8:1::1=101 ens20=192.168.1.6"

# Remote host or gateway availability check interval.
# Supported units: s (seconds), m (minutes), h (hours), d (days), w (weeks), M (months), y (years).
# Example: 30s, 10m, 1h, 1d, 1w, 1M, 1y.
CHECK_INTERVAL=30

# Host (IP/DNS) for availability monitoring through gateways
PING_HOST="dns.google"

# Check speed on gateways: yes/no
SPEEDTEST=no

# Host (IP/DNS) for speedtest checks through gateways
# If no protocol (http:// or https://) is specified, http:// will be used by default.
SPEEDTEST_HOST="nbg1-speed.hetzner.com"

# File size in megabytes (filename) on the remote host for speed testing
SPEEDTEST_SCOPE="100MB.bin"

# Operational Modes (ROLE):
# single:
#    Standalone mode. The script operates independently, performing health
#    checks and managing routes locally. VRRP logic is ignored.
#
# master / master-advisor:
#    Static Master roles. The node provides the gateway list to others via
#    VIRTUAL_PORT. If VIRTUAL_IPADDRESS is lost, the node stops the delivery
#    service and waits for the IP to return.
#
# slave:
#    Static Slave role. The node fetches data from the Master via VIRTUAL_PORT.
#    If VIRTUAL_IPADDRESS appears on this host, it switches to 'single' mode.
#
# cluster:
#    Dynamic HA mode. The node automatically switches between Master and Slave:
#    - Acts as Master (provider) when VIRTUAL_IPADDRESS is found locally.
#    - Acts as Slave (receiver) when VIRTUAL_IPADDRESS is missing.
ROLE="single"

# Virtual IP Address (CIDR format) managed by Keepalived.
# Required for 'master', 'master-advisor', 'slave', and 'cluster' roles.
VIRTUAL_IPADDRESS="192.168.1.1/24"

# TCP port for gateway data distribution.
# Master/Advisor listens on this port via VIRTUAL_IPADDRESS.
# Slave connects to this port to fetch the active gateways list.
VIRTUAL_PORT=8888
